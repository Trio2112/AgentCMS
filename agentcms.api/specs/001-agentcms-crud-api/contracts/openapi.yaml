openapi: 3.0.3
info:
  title: AgentCMS CRUD API
  description: |
    RESTful API for managing CMS content (Sites, Pages, Assets) with multi-tenant isolation.
    
    **Key Features**:
    - Multi-tenant architecture via site-scoped routes
    - Content lifecycle (draft/published states)
    - Asset management with pluggable storage
    
    **Non-Standard Behavior**:
    - Returns 204 No Content instead of 404 Not Found when resources don't exist
  version: 1.0.0
  contact:
    name: AgentCMS API Support
  license:
    name: MIT

servers:
  - url: https://localhost:5001/v1
    description: Local development server

tags:
  - name: Sites
    description: Multi-tenant container for content
  - name: Pages
    description: Content pages with lifecycle states
  - name: Assets
    description: Media files and documents

paths:
  /sites:
    get:
      tags: [Sites]
      summary: List all sites
      operationId: listSites
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SiteDto'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    post:
      tags: [Sites]
      summary: Create a new site
      operationId: createSite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteDto'
      responses:
        '201':
          description: Site created successfully
          headers:
            Location:
              description: URL of the created site
              schema:
                type: string
                example: /v1/sites/3fa85f64-5717-4562-b3fc-2c963f66afa6
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sites/{siteId}:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
    
    get:
      tags: [Sites]
      summary: Get site by ID
      operationId: getSite
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteDto'
        '204':
          description: Site not found (non-standard)
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    put:
      tags: [Sites]
      summary: Update site
      operationId: updateSite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteDto'
      responses:
        '200':
          description: Site updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteDto'
        '204':
          description: Site not found (non-standard)
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    delete:
      tags: [Sites]
      summary: Delete site
      description: |
        Deletes a site. Fails if the site has any pages or assets.
        
        **Business Rule**: Cannot delete site with existing content.
      operationId: deleteSite
      responses:
        '200':
          description: Site deleted successfully
        '204':
          description: Site not found (non-standard)
        '400':
          description: Site has existing content (cannot delete)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Cannot delete site with existing content"
                details:
                  message: ["Site has 5 pages and 3 assets. Delete all content first."]
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sites/{siteId}/pages:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
    
    get:
      tags: [Pages]
      summary: List pages for site
      operationId: listPages
      parameters:
        - name: isPublished
          in: query
          description: Filter by publish status
          schema:
            type: boolean
          example: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PageDto'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    post:
      tags: [Pages]
      summary: Create a new page
      operationId: createPage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePageDto'
      responses:
        '201':
          description: Page created successfully
          headers:
            Location:
              description: URL of the created page
              schema:
                type: string
                example: /v1/sites/3fa85f64-5717-4562-b3fc-2c963f66afa6/pages/7b2c8e4a-1234-5678-90ab-cdef12345678
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sites/{siteId}/pages/{pageId}:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
      - $ref: '#/components/parameters/PageIdParam'
    
    get:
      tags: [Pages]
      summary: Get page by ID
      operationId: getPage
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDto'
        '204':
          description: Page not found or not accessible in this site (non-standard)
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    put:
      tags: [Pages]
      summary: Update page
      operationId: updatePage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePageDto'
      responses:
        '200':
          description: Page updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDto'
        '204':
          description: Page not found or not accessible in this site (non-standard)
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    delete:
      tags: [Pages]
      summary: Delete page
      description: Permanently deletes a page
      operationId: deletePage
      responses:
        '200':
          description: Page deleted successfully
        '204':
          description: Page not found or not accessible in this site (non-standard)
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sites/{siteId}/assets:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
    
    get:
      tags: [Assets]
      summary: List assets for site
      operationId: listAssets
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetDto'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    post:
      tags: [Assets]
      summary: Upload a new asset (multipart)
      description: |
        Upload a file directly to the server. File is stored locally and URL is generated.
        
        **Validation**:
        - Max file size: 30 MB
        - Allowed MIME types: image/jpeg, image/png, application/pdf
      operationId: uploadAsset
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateAssetDto'
      responses:
        '201':
          description: Asset uploaded successfully
          headers:
            Location:
              description: URL of the created asset
              schema:
                type: string
                example: /v1/sites/3fa85f64-5717-4562-b3fc-2c963f66afa6/assets/9d4e6f2a-abcd-1234-5678-90abcdef1234
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDto'
        '400':
          description: Validation error (file too large, invalid MIME type)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                fileSizeTooLarge:
                  summary: File size exceeds limit
                  value:
                    error: "Validation failed"
                    details:
                      File: ["File size exceeds 30 MB limit"]
                invalidMimeType:
                  summary: Invalid MIME type
                  value:
                    error: "Validation failed"
                    details:
                      MimeType: ["MIME type application/zip is not allowed"]
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sites/{siteId}/assets/url:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
    
    post:
      tags: [Assets]
      summary: Create asset from client-provided URL
      description: |
        Store an asset record with a client-provided URL (no file upload to server).
        
        **Note**: File is NOT stored locally; URL is saved as-is.
      operationId: createAssetFromUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetFromUrlDto'
      responses:
        '201':
          description: Asset created successfully
          headers:
            Location:
              description: URL of the created asset
              schema:
                type: string
                example: /v1/sites/3fa85f64-5717-4562-b3fc-2c963f66afa6/assets/9d4e6f2a-abcd-1234-5678-90abcdef1234
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sites/{siteId}/assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
      - $ref: '#/components/parameters/AssetIdParam'
    
    get:
      tags: [Assets]
      summary: Get asset metadata by ID
      operationId: getAsset
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDto'
        '204':
          description: Asset not found or not accessible in this site (non-standard)
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    delete:
      tags: [Assets]
      summary: Delete asset
      description: |
        Permanently deletes an asset record and the underlying file (if uploaded via multipart).
        
        **Note**: For client-provided URLs, only the record is deleted (no file deletion).
      operationId: deleteAsset
      responses:
        '200':
          description: Asset deleted successfully
        '204':
          description: Asset not found or not accessible in this site (non-standard)
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sites/{siteId}/assets/{assetId}/file:
    parameters:
      - $ref: '#/components/parameters/SiteIdParam'
      - $ref: '#/components/parameters/AssetIdParam'
    
    get:
      tags: [Assets]
      summary: Download asset file
      description: |
        Stream the asset file content. Only works for multipart-uploaded assets.
        
        **Note**: For client-provided URLs, returns 404 or redirects to external URL.
      operationId: downloadAssetFile
      responses:
        '200':
          description: File content
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
          headers:
            Content-Type:
              description: MIME type of the file
              schema:
                type: string
                example: image/jpeg
            Content-Disposition:
              description: Filename for download
              schema:
                type: string
                example: attachment; filename="example.jpg"
        '404':
          description: File not found (asset record exists but file missing)
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    SiteIdParam:
      name: siteId
      in: path
      required: true
      description: Unique site identifier (GUID)
      schema:
        type: string
        format: uuid
      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    
    PageIdParam:
      name: pageId
      in: path
      required: true
      description: Unique page identifier (GUID)
      schema:
        type: string
        format: uuid
      example: 7b2c8e4a-1234-5678-90ab-cdef12345678
    
    AssetIdParam:
      name: assetId
      in: path
      required: true
      description: Unique asset identifier (GUID)
      schema:
        type: string
        format: uuid
      example: 9d4e6f2a-abcd-1234-5678-90abcdef1234

  schemas:
    SiteDto:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Unique site identifier
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        name:
          type: string
          maxLength: 255
          description: Site name (must be unique)
          example: My Blog
        description:
          type: string
          maxLength: 255
          nullable: true
          description: Optional site description
          example: Personal blog site
    
    CreateSiteDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
          description: Site name (must be unique)
          example: My Blog
        description:
          type: string
          maxLength: 255
          nullable: true
          description: Optional site description
          example: Personal blog site
    
    UpdateSiteDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
          description: Site name (must be unique)
          example: My Blog
        description:
          type: string
          maxLength: 255
          nullable: true
          description: Optional site description
          example: Personal blog site
    
    PageDto:
      type: object
      required:
        - id
        - siteId
        - title
        - createdDate
        - updatedDate
        - isPublished
      properties:
        id:
          type: string
          format: uuid
          description: Unique page identifier
          example: 7b2c8e4a-1234-5678-90ab-cdef12345678
        siteId:
          type: string
          format: uuid
          description: Owning site identifier
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        title:
          type: string
          maxLength: 255
          description: Page title
          example: Welcome to My Blog
        body:
          type: string
          nullable: true
          description: Page content (HTML/Markdown/plain text)
          example: This is the main content of the page.
        createdDate:
          type: string
          format: date-time
          description: UTC timestamp of creation
          example: 2026-02-12T15:30:00Z
        updatedDate:
          type: string
          format: date-time
          description: UTC timestamp of last update
          example: 2026-02-12T16:45:00Z
        publishedDate:
          type: string
          format: date-time
          nullable: true
          description: UTC timestamp of publication (null = draft)
          example: 2026-02-12T17:00:00Z
        isPublished:
          type: boolean
          description: Computed field (publishedDate != null)
          example: true
        createdBy:
          type: string
          maxLength: 255
          nullable: true
          description: User/system that created the page
          example: admin
        updatedBy:
          type: string
          maxLength: 255
          nullable: true
          description: User/system that last updated the page
          example: admin
    
    CreatePageDto:
      type: object
      required:
        - title
        - isPublished
      properties:
        title:
          type: string
          maxLength: 255
          description: Page title
          example: Welcome to My Blog
        body:
          type: string
          nullable: true
          description: Page content
          example: This is the main content of the page.
        isPublished:
          type: boolean
          description: Publish immediately (true = set publishedDate, false = draft)
          example: false
        createdBy:
          type: string
          maxLength: 255
          nullable: true
          description: User/system creating the page
          example: admin
    
    UpdatePageDto:
      type: object
      required:
        - title
        - isPublished
      properties:
        title:
          type: string
          maxLength: 255
          description: Page title
          example: Welcome to My Blog
        body:
          type: string
          nullable: true
          description: Page content
          example: This is the main content of the page.
        isPublished:
          type: boolean
          description: Publish state (true = set publishedDate, false = clear publishedDate)
          example: true
        updatedBy:
          type: string
          maxLength: 255
          nullable: true
          description: User/system updating the page
          example: admin
    
    AssetDto:
      type: object
      required:
        - id
        - siteId
        - filename
        - mimeType
        - url
        - createdDate
      properties:
        id:
          type: string
          format: uuid
          description: Unique asset identifier
          example: 9d4e6f2a-abcd-1234-5678-90abcdef1234
        siteId:
          type: string
          format: uuid
          description: Owning site identifier
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        filename:
          type: string
          maxLength: 255
          description: Original filename
          example: photo.jpg
        mimeType:
          type: string
          maxLength: 100
          description: Content type
          enum:
            - image/jpeg
            - image/png
            - application/pdf
          example: image/jpeg
        url:
          type: string
          maxLength: 500
          description: Accessible URL (local or external)
          example: https://localhost:5001/v1/sites/3fa85f64-5717-4562-b3fc-2c963f66afa6/assets/9d4e6f2a-abcd-1234-5678-90abcdef1234/file
        createdDate:
          type: string
          format: date-time
          description: UTC timestamp of creation
          example: 2026-02-12T15:30:00Z
        createdBy:
          type: string
          maxLength: 255
          nullable: true
          description: User/system that uploaded the asset
          example: admin
    
    CreateAssetDto:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: File to upload (max 30 MB, MIME whitelist enforced)
        createdBy:
          type: string
          maxLength: 255
          nullable: true
          description: User/system uploading the asset
          example: admin
    
    CreateAssetFromUrlDto:
      type: object
      required:
        - url
        - filename
        - mimeType
      properties:
        url:
          type: string
          format: uri
          maxLength: 500
          description: External URL of the asset
          example: https://example.com/photo.jpg
        filename:
          type: string
          maxLength: 255
          description: Filename for the asset
          example: photo.jpg
        mimeType:
          type: string
          maxLength: 100
          description: Content type
          enum:
            - image/jpeg
            - image/png
            - application/pdf
          example: image/jpeg
        createdBy:
          type: string
          maxLength: 255
          nullable: true
          description: User/system creating the asset record
          example: admin
    
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error summary
          example: Validation failed
        details:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Field-level validation errors
          example:
            Title: ["The Title field is required."]
            MimeType: ["MIME type application/zip is not allowed"]

  responses:
    BadRequest:
      description: Validation error or business rule violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    InternalServerError:
      description: Unhandled server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Internal server error"
            details: {}
