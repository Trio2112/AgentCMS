openapi: 3.0.1
info:
  title: AgentCMS Admin API - Pages
  description: Page management endpoints for the AgentCMS Admin Portal with simple publish/draft toggle
  version: "1.0"

paths:
  /v1/sites/{siteId}/pages:
    get:
      summary: List all pages for a site
      operationId: listPages
      tags:
        - Pages
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PageDto'
        '400':
          description: Invalid site ID
        '500':
          description: Server error
    
    post:
      summary: Create a new page
      operationId: createPage
      tags:
        - Pages
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePageDto'
      responses:
        '201':
          description: Page created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDto'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Server error

  /v1/sites/{siteId}/pages/{id}:
    get:
      summary: Get a specific page
      operationId: getPage
      tags:
        - Pages
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDto'
        '404':
          description: Page not found
        '500':
          description: Server error
    
    put:
      summary: Update an existing page
      operationId: updatePage
      tags:
        - Pages
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePageDto'
      responses:
        '200':
          description: Page updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDto'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Page not found
        '500':
          description: Server error
    
    delete:
      summary: Delete a page
      operationId: deletePage
      tags:
        - Pages
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Page deleted successfully
        '404':
          description: Page not found
        '500':
          description: Server error

components:
  schemas:
    PageDto:
      type: object
      required:
        - id
        - siteId
        - title
        - isPublished
        - createdDate
        - updatedDate
        - createdBy
        - updatedBy
        - lastModified
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the page
          readOnly: true
        siteId:
          type: string
          format: uuid
          description: ID of the site this page belongs to
          readOnly: true
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Page title
        body:
          type: string
          maxLength: 65535
          nullable: true
          description: Page content (plain text or basic formatted text)
        isPublished:
          type: boolean
          description: Publication status (true = published, false = draft)
        createdDate:
          type: string
          format: date-time
          description: Timestamp when page was created
          readOnly: true
        updatedDate:
          type: string
          format: date-time
          description: Timestamp when page was last updated
          readOnly: true
        createdBy:
          type: string
          description: Username or ID of the user who created the page
          readOnly: true
        updatedBy:
          type: string
          description: Username or ID of the user who last updated the page
          readOnly: true
        lastModified:
          type: string
          format: date-time
          description: Timestamp for concurrent edit detection
          readOnly: true
      example:
        id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        siteId: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
        title: "About Us"
        body: "Welcome to our website. We are a team of passionate developers."
        isPublished: true
        createdDate: "2026-02-13T10:30:00Z"
        updatedDate: "2026-02-13T14:45:00Z"
        createdBy: "john.doe@example.com"
        updatedBy: "jane.smith@example.com"
        lastModified: "2026-02-13T14:45:00Z"

    CreatePageDto:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Page title (required)
        body:
          type: string
          maxLength: 65535
          nullable: true
          description: Page content (optional)
        isPublished:
          type: boolean
          default: false
          description: Publication status (defaults to false/draft if not specified)
      example:
        title: "New Page Title"
        body: "This is the page content."
        isPublished: false

    UpdatePageDto:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Page title
        body:
          type: string
          maxLength: 65535
          nullable: true
          description: Page content
        isPublished:
          type: boolean
          description: Publication status
      example:
        title: "Updated Page Title"
        body: "Updated page content."
        isPublished: true

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: A URI reference identifying the problem type
        title:
          type: string
          description: A short, human-readable summary of the problem type
        status:
          type: integer
          format: int32
          description: The HTTP status code
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem
        instance:
          type: string
          description: A URI reference identifying the specific occurrence of the problem
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Validation errors (field name → error messages)
      example:
        type: "https://tools.ietf.org/html/rfc7231#section-6.5.1"
        title: "One or more validation errors occurred."
        status: 400
        detail: "See the errors property for details."
        instance: "/v1/sites/7c9e6679-7425-40de-944b-e07fc1f90ae7/pages"
        errors:
          title:
            - "The title field is required."
